server.port=8080

# Mostra a mensagem de erro (ex.: "E-mail ou senha incorretos") na resposta da API
server.error.include-message=always

# Banco de dados relacional H2, salvo no arquivo ./data/presenca60
spring.datasource.url=jdbc:h2:file:./data/presenca60
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Cria as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Chave secreta usada para assinar os tokens JWT
jwt.secret=presenca60-chave-secreta-com-mais-de-32-caracteres
